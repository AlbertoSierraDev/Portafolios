name: Build and deploy Node.js project to Azure Function App - portafolios-api

on:
  push:
    branches:
      - azure-migration
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './server'
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: npm ci

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E71425539ED54824BE047DC5C15CE6B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4313496615D2448DAFDCD5728EC7925D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FE5CEFF7E749486396DDC6164E7AC0F0 }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'portafolios-api'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
